# ==============================================================================
# CONFIGURACIÓN OPTIMIZADA DE NGINX - GRUPO FLORICULTOR FLORSANI
# UBICACIÓN EN VPS: /etc/nginx/sites-available/dw_florsani
# ENLACE SIMBÓLICO: ln -s /etc/nginx/sites-available/dw_florsani /etc/nginx/sites-enabled/
# ==============================================================================

# 1. Agrupación Upstream con conexiones persistentes (Keepalive) hacia Gunicorn
upstream dw_florsani_backend {
    server 127.0.0.1:8095;
    keepalive 32;
}

server {
    listen 80;
    server_name _;  # O reemplaza con tu dominio/subdominio ej: erp.florsani.com

    # Tamaño máximo de subida para archivos de censo Excel y estados de cultivo
    client_max_body_size 64M;

    # ==============================================================================
    # COMPRESIÓN GZIP (Acelera navegación en celulares y tablets en invernaderos)
    # Reduce el peso de páginas, respuestas JSON y tablas en un 70% a 85%
    # ==============================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    # ==============================================================================
    # CACHÉ DE ARCHIVOS ESTÁTICOS (CSS, JS, Fuentes, Logos)
    # Evita que peticiones de imágenes o estilos pasen por Python/Gunicorn
    # ==============================================================================
    location /static/ {
        # Si usas volumen mapeado en el VPS, puedes apuntar directamente a los archivos:
        # root /ruta/a/dw_Florsani/app;
        # expires 30d;
        # add_header Cache-Control "public, no-transform";
        
        # O reenviar al contenedor aprovechando el caché HTTP:
        proxy_pass http://dw_florsani_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # ==============================================================================
    # PROXY INVERSO PRINCIPAL HACIA FLASK + GUNICORN
    # ==============================================================================
    location / {
        proxy_pass http://dw_florsani_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Encabezados de cliente y protocolo
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts extendidos para reportes pesados de cosecha o proyección
        proxy_connect_timeout 90s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;

        # Buffering optimizado para respuestas grandes (tablas y exportaciones)
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }
}
